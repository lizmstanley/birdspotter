<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#166534" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Scout Test" />
    <link rel="manifest" href="/circle-scout/spike/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/circle-scout/spike/icon-192.png" />
    <title>Circle Scout phone test</title>
  </head>
  <body>
    <main>
      <h1>Circle Scout phone test</h1>

      <section>
        <h2>Live location</h2>
        <div id="map" class="map"></div>
        <p id="location-status" class="status"></p>
      </section>

      <section>
        <h2>Screen on</h2>
        <button id="wake-toggle" type="button">Keep screen on</button>
        <p id="wake-status" class="status"></p>
      </section>

      <section>
        <h2>eBird</h2>
        <label for="ebird-key">eBird API key</label>
        <input id="ebird-key" type="password" autocomplete="off" spellcheck="false" />
        <div class="row">
          <button id="ebird-save" type="button">Save key</button>
          <button id="ebird-load" type="button">Load sightings here</button>
        </div>
        <p id="ebird-saved" class="detail"></p>
        <p id="ebird-status" class="status"></p>
        <p class="detail">Bird data from <a href="https://ebird.org" target="_blank" rel="noreferrer">eBird.org</a>.</p>
      </section>

      <section>
        <h2>QR make</h2>
        <label for="outline-file">KML, KMZ, or GeoJSON file</label>
        <input id="outline-file" type="file" accept=".kml,.kmz,.geojson,.json" />
        <label for="outline-pick">Outline</label>
        <select id="outline-pick" disabled></select>
        <canvas id="qr-canvas" class="qr"></canvas>
        <p><a id="qr-link" hidden>Open this link</a></p>
        <p id="qr-make-status" class="status"></p>
      </section>

      <section>
        <h2>QR read</h2>
        <p id="opened-as" class="detail"></p>
        <div class="row">
          <button id="scan-start" type="button">Scan with camera</button>
          <button id="scan-stop" type="button" disabled>Stop</button>
        </div>
        <video id="scan-video" class="scan" playsinline muted hidden></video>
        <p id="qr-read-status" class="status"></p>
      </section>

      <section>
        <h2>Storage</h2>
        <p id="storage-status" class="status"></p>
        <p id="sw-status" class="detail"></p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
