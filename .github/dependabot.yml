version: 2
# xlsx is a cdn.sheetjs.com tarball, which Dependabot cannot track. CLAUDE.md has its update path.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
        update-types: [minor, patch]
      maplibre:
        patterns: [maplibre-gl]
        update-types: [minor, patch]
      turf:
        patterns: ['@turf/*']
        update-types: [minor, patch]
      lint:
        patterns: [eslint, '@eslint/*', typescript-eslint, eslint-plugin-*]
        update-types: [minor, patch]
      build:
        patterns: [vite, '@vitejs/*', typescript, '@types/node']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # GitHub Actions takes no semver cooldown keys.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
