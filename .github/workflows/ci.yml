name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: node scripts/check-maplibre-pins.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          # A dual license such as (MIT OR Apache-2.0) passes when one side is listed.
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0,
            Unlicense, CC0-1.0, CC-BY-4.0, Python-2.0
          allow-dependencies-licenses: >-
            pkg:npm/@birdspotter/birding-core, pkg:npm/@birdspotter/birdspotter,
            pkg:npm/@birdspotter/cbc-manager, pkg:npm/@birdspotter/cbc-scout

  # Runs on every PR rather than behind a path filter: it takes seconds, and ci-ok must always report.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
          advanced-security: false
          annotations: true

  # Also runs on push to main, so each PR compares against the report the latest green main run uploaded.
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Download the size report from the latest green main run
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty') || run_id=""
          if [ -z "$run_id" ] || ! gh run download "$run_id" --repo "$REPO" --name bundle-size --dir "$RUNNER_TEMP/main"; then
            echo "No size report from main, so the summary leaves out the change column."
          fi
      - run: node scripts/bundle-size.ts --report "$RUNNER_TEMP/bundle-size.json" --baseline "$RUNNER_TEMP/main/bundle-size.json"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-size
          path: ${{ runner.temp }}/bundle-size.json
          if-no-files-found: error

  ci-ok:
    if: always()
    needs: [check, dependency-review, workflow-lint, size]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          exit 1
